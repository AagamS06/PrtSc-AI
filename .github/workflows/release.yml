name: Build Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Import check (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "import providers, config, winsys, ui, main; print(winsys.parse_hotkey('Win+Shift+A'))"

      - name: Build icon
        env:
          QT_QPA_PLATFORM: offscreen
        run: python make_icon.py

      - name: Build exe
        run: pyinstaller --noconfirm --onefile --windowed --name PrtSc-AI --icon assets\icon.ico --hidden-import keyring.backends.Windows main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrtSc-AI
          path: dist/PrtSc-AI.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PrtSc-AI.exe
          body: |
            ## Download
            **[PrtSc-AI.exe](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/PrtSc-AI.exe)** — single file, no install needed.

            1. Download `PrtSc-AI.exe` and double-click it.
            2. Windows may show *"Windows protected your PC"* because the app isn't code-signed. Click **More info → Run anyway**.
            3. Settings open on first run: pick a provider, paste an API key (Gemini has a free tier), pick a model, **Save**.
            4. Snip with **Win+Shift+S** and click the **✦ AI** bubble, or press **Win+Shift+A**.

            PrtSc AI lives in the system tray (bottom-right). Right-click it for Settings or Quit.

name: Build Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Import check (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "import providers, config, winsys, ui, main; print(winsys.parse_hotkey('Win+Shift+A'))"

      - name: Test key storage + migration from v1.0.0 (source)
        shell: pwsh
        run: |
          # v1.0.0 saved keys through the keyring library. Recreate that, then check the new code finds and migrates them.
          python -c "import keyring; from keyring.backends.Windows import WinVaultKeyring as K; k=K(); k.set_password('PrtSc AI','Gemini (Google)','legacy-gemini'); k.set_password('PrtSc AI','Claude (Anthropic)','legacy-claude')"
          python -c "from config import Config, _cred_read, _target; Config(); assert Config.get_key('Gemini (Google)')=='legacy-gemini'; assert Config.get_key('Claude (Anthropic)')=='legacy-claude'; assert _cred_read(_target('Gemini (Google)'))[1]=='legacy-gemini'; print('legacy keys migrated OK')"
          python -c "from config import Config; Config(); [Config.set_key(p,'') for p in ('Gemini (Google)','Claude (Anthropic)')]"
          python -c "from keyring.backends.Windows import WinVaultKeyring as K; k=K(); [k.delete_password('PrtSc AI',p) for p in ('Gemini (Google)','Claude (Anthropic)')]"
          python -c "import config, sys; sys.exit(config.selftest())"

      - name: Build icon
        env:
          QT_QPA_PLATFORM: offscreen
        run: python make_icon.py

      - name: Build exe
        run: pyinstaller --noconfirm --onefile --windowed --name PrtSc-AI --icon assets\icon.ico --hidden-import keyring.backends.Windows main.py

      - name: Self-test the built exe (keys persist between runs)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\PrtSc-AI.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "exe selftest failed with $($p.ExitCode)" }
          Write-Host "exe selftest passed"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrtSc-AI
          path: dist/PrtSc-AI.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PrtSc-AI.exe
